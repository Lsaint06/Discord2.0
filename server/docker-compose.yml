# Discord 2.0 on Linux ARM64 (NVIDIA Jetson Orin Nano). All credentials come from an untracked
# .env next to this file (see .env.example).
#
# Two ways to run it:
#   docker compose up -d                    LAN only (backend + LiveKit), as before
#   docker compose --profile public up -d   adds Caddy: HTTPS/WSS on 443 for friends outside the
#                                           LAN (see docs/milestone-11-project-connect.md)
#
# Never forward 22, 3001 or 7880 on the router. In public mode forward only 80/tcp, 443/tcp
# (Caddy), 7881/tcp and 7882/udp (LiveKit media).
services:
  server:
    build: .
    image: discord2-server:dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # DEVELOPMENT ONLY password-less identities. Off unless explicitly enabled; production
      # refuses to start with it on (see config.ts).
      DEV_AUTH: ${DEV_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Desktop apps older than 1.1 load from file:// and send Origin "null". Set true only
      # while such apps still need to connect; the 1.1 app uses its own app:// origin.
      ALLOW_NULL_ORIGIN: ${ALLOW_NULL_ORIGIN:-}
      # Only Caddy's fixed address (below) may tell the backend a client's real IP.
      TRUST_PROXY: ${TRUST_PROXY:-172.30.0.10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Voice. The secret stays inside the backend; clients only ever receive short-lived JWTs.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      # LiveKit runs on the host network; the backend reaches its API through the Docker host.
      LIVEKIT_URL: http://host.docker.internal:7880
      # What clients connect to for signaling. Public mode: wss://<PUBLIC_HOSTNAME>.
      # LAN-only mode: ws://<Jetson LAN IP>:7880.
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:?set LIVEKIT_PUBLIC_URL in .env, e.g. wss://name.duckdns.org or ws://192.168.68.65:7880}
      # Optional: handed to clients that connect on the LAN address (no router loopback needed).
      LIVEKIT_LAN_URL: ${LIVEKIT_LAN_URL:-}
      # Attachments (Milestone 6). Files live in /data/attachments on the same volume as the
      # database. Empty = built-in default (see .env.example).
      UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-}
      UPLOAD_MAX_REQUEST_MB: ${UPLOAD_MAX_REQUEST_MB:-}
      UPLOAD_MAX_IMAGE_MEGAPIXELS: ${UPLOAD_MAX_IMAGE_MEGAPIXELS:-}
      UPLOAD_USER_QUOTA_MB: ${UPLOAD_USER_QUOTA_MB:-}
      UPLOAD_TOTAL_QUOTA_MB: ${UPLOAD_TOTAL_QUOTA_MB:-}
      UPLOAD_MIN_FREE_DISK_MB: ${UPLOAD_MIN_FREE_DISK_MB:-}
      # Milestone 13: large files (off by default; see .env.example before enabling).
      UPLOAD_LARGE_FILES: ${UPLOAD_LARGE_FILES:-false}
      UPLOAD_MAX_LARGE_FILE_MB: ${UPLOAD_MAX_LARGE_FILE_MB:-}
      UPLOAD_EPHEMERAL_THRESHOLD_MB: ${UPLOAD_EPHEMERAL_THRESHOLD_MB:-}
      UPLOAD_EPHEMERAL_HOURS: ${UPLOAD_EPHEMERAL_HOURS:-}
      UPLOAD_LARGE_USER_QUOTA_MB: ${UPLOAD_LARGE_USER_QUOTA_MB:-}
      UPLOAD_LARGE_POOL_MB: ${UPLOAD_LARGE_POOL_MB:-}
      UPLOAD_LARGE_MIN_FREE_MB: ${UPLOAD_LARGE_MIN_FREE_MB:-}
      UPLOAD_LARGE_CONCURRENT: ${UPLOAD_LARGE_CONCURRENT:-}
      # Accounts and sessions (Milestone 7). Empty = built-in default (see .env.example).
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-}
      ARGON2_PASSES: ${ARGON2_PASSES:-}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-}
      ARGON2_MAX_CONCURRENT: ${ARGON2_MAX_CONCURRENT:-}
      # Milestone 13: registration policy and email (defaults: invite-only, no email).
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      REGISTRATION_AUTO_JOIN_SERVER: ${REGISTRATION_AUTO_JOIN_SERVER:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-none}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Only if you mount the file into the container yourself (e.g. a compose override).
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Milestone 13: GIF picker (default off). The API key stays on the server.
      GIF_PROVIDER: ${GIF_PROVIDER:-none}
      GIF_API_KEY: ${GIF_API_KEY:-}
      GIF_API_KEY_FILE: ${GIF_API_KEY_FILE:-}
      GIF_RATING: ${GIF_RATING:-pg-13}
      GIF_COUNTRY: ${GIF_COUNTRY:-}
      GIF_LOCALE: ${GIF_LOCALE:-en}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # LAN access (desktop "Home network" profile). Loopback by default; on the Jetson set
      # BIND_ADDRESS to its LAN IP (192.168.68.65). Never forwarded on the router.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - discord2-data:/data
    networks:
      default:
        ipv4_address: 172.30.0.20
    depends_on:
      - livekit
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    # TLS (free Let's Encrypt certificates) + reverse proxy for public access. Only started with
    # `--profile public`.
    image: caddy:2.11.7-alpine
    profiles: ["public"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      # Not `:?`: Compose interpolates every service, even ones whose profile is off, so a
      # required variable here would break plain LAN-only `docker compose up`. Checked at start-up
      # instead (below).
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    # Refuse to start without a plain DNS name (it is substituted into the Caddyfile as the site
    # address, so anything else could change its meaning).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo "$$PUBLIC_HOSTNAME" | grep -Eqx '[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+'
        || { echo 'set PUBLIC_HOSTNAME in .env (lowercase DNS name, e.g. name.duckdns.org)' >&2; exit 64; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: keep across restarts (Let's Encrypt rate limits).
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # Fixed: the backend trusts X-Forwarded-For only from this address (TRUST_PROXY).
        ipv4_address: 172.30.0.10
    depends_on:
      - server
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  livekit:
    # Official multi-arch image (linux/amd64 + linux/arm64). Pinned for reproducible deploys.
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    # Host networking, so LiveKit can offer clients both its LAN address (PCs at home) and the
    # public address (friends elsewhere) as media candidates. Ports used on the host:
    #   7880/tcp signaling (LAN + Caddy only, never forwarded), 7881/tcp ICE/TCP, 7882/udp ICE/UDP.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    # It shares the host's network namespace: drop every capability (Docker's defaults include
    # NET_RAW, i.e. raw sockets on the host's interfaces). Its ports are all above 1024.
    cap_drop: [ALL]
    environment:
      # Config is generated from .env so no secret ever lives in a tracked file.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # ICE over TCP fallback and a single multiplexed UDP port for all media.
          tcp_port: 7881
          udp_port: 7882
          # LAN-only mode: false, and node_ip = the Jetson's LAN address.
          # Public mode: true. LiveKit discovers the public IP via STUN at start-up
          # (deploy/public-ip-watch.sh restarts it when the IP changes).
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
          node_ip: ${LIVEKIT_NODE_IP:-}
          # Keep the LAN address as a candidate too, so PCs at home connect directly.
          advertise_internal_ip: true
          # Many home routers don't loop traffic back to their own public address.
          skip_external_ip_validation: true
          # Only offer the LAN address (not Docker bridge addresses) as a local candidate.
          ips:
            includes:
              - ${LIVEKIT_LAN_CIDR:-192.168.0.0/16}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://${BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}/api/livekit/webhook
        room:
          auto_create: true
          empty_timeout: 300
          departure_timeout: 20
          max_participants: 25
          # LiveKit's default codec list, plus H.264 profile 42001f: Chromium on Windows only
          # hardware-encodes (NVENC/AMF/QSV via Media Foundation) that profile; with the default
          # 42e01f it falls back to software OpenH264. The SFU only forwards packets (no transcoding).
          enabled_codecs:
            - mime: audio/pcmu
            - mime: audio/pcma
            - mime: audio/opus
            - mime: audio/red
            - mime: video/vp8
            - mime: video/h264
              fmtp_line: level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f
            - mime: video/h264
            - mime: video/vp9
            - mime: video/av1
            - mime: video/h265
            - mime: video/rtx
        logging:
          level: ${LIVEKIT_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  discord2-data:
  caddy-data:
  caddy-config: