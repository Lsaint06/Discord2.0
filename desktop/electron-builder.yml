# Keep these stable: they identify the installed app (upgrade in place, notifications, saved
# sign-in in %APPDATA%\desktop). Changing them would install a second copy.
appId: com.discord2.app
productName: Discord 2.0
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  # Previous build output must never end up inside the app (electron-builder only excludes the
  # output folder of the current run).
  - '!dist{,/**/*}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Development tools (e.g. the sound renderer) are not part of the app.
  - '!scripts{,/**/*}'
asarUnpack:
  - resources/**
win:
  executableName: Discord2
  # Installer for normal use; the zip is the unpacked app for testing (no installation).
  target:
    - nsis
    - zip
  # Used by the zip; the installer has its own name below.
  artifactName: Discord2-${version}-win-${arch}.${ext}
nsis:
  artifactName: Discord2-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No auto-update feed: new versions are distributed as installers (see
# docs/milestone-11-project-connect.md). A newer installer upgrades in place (same appId).
publish:
  provider: github
  owner: Lsaint06
  repo: Discord2.0
